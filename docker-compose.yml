services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jh
      POSTGRES_DB: jh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jh -d jh"]
      interval: 10s
      retries: 5
    # порт наружу не публикуется

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jh:${POSTGRES_PASSWORD}@db:5432/jh
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
