[project]
name = "job-hunter-bot"
version = "0.1.0"
description = "Telegram-бот для поиска стажировок, вакансий и фриланс-заказов с оценкой релевантности AI-ключом пользователя"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "cryptography>=43",
  "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
